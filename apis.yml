name: Syremis Therapeutics
description: 'Syremis Therapeutics is a clinical-stage biopharmaceutical company based
  in Tel Aviv, Israel and Boston, Massachusetts, developing best-in-class oral small-molecule
  medicines for serious mental health conditions. Its neuropsychiatric pipeline is
  rooted in clinically validated mechanisms including muscarinic M1/M4 agonism and
  next-generation NMDA antagonism; lead program ST-905 is a dual M1/M4 agonist in
  Phase 1 for schizophrenia, with ST-901 also spun out from Clexio Biosciences. The
  company launched publicly in December 2025 with a $165M Series A co-led by Dexcel
  Pharma and Third Rock Ventures, with participation from Bain Capital Life Sciences,
  GV (Google Ventures), QVT, and Pictet. Surfaced in the API Evangelist network as
  a portfolio company of GV. This company publishes no public API, developer, or event
  surface at this time.'
